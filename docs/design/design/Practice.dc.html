<style>

ruby rt{font-size:.38em;font-weight:400;color:#6B645B;letter-spacing:.04em}
::placeholder{color:#9A9287}

</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: #F3F0E7; background-image: repeating-linear-gradient(90deg, rgba(28,26,23,.022) 0 1px, transparent 1px 3px), repeating-linear-gradient(0deg, rgba(28,26,23,.014) 0 1px, transparent 1px 4px);">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 24px 18px 14px; border-bottom: 1px solid #D9D2C1;">
<div style="display: flex; align-items: center; gap: 9px;">
<span style="width: 26px; height: 26px; border-radius: 3px; background: #B8342A; color: #FCF7EE; font-family: 'Shippori Mincho','Hiragino Mincho ProN',serif; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;">響</span>
<span style="font-family: 'Shippori Mincho','Hiragino Mincho ProN',serif; font-size: 19px; letter-spacing: .08em;">Echo</span>
</div>
<a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D2C1; border-radius: 4px; background: #FBF9F3; text-decoration: none;">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g fill="#1C1A17"><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(45 12 12)"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(90 12 12)"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(135 12 12)"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(180 12 12)"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(225 12 12)"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(270 12 12)"></rect><rect x="10.4" y="1.4" width="3.2" height="5.2" rx="1.1" transform="rotate(315 12 12)"></rect></g><circle cx="12" cy="12" r="6.3" stroke="#1C1A17" stroke-width="1.7"></circle><circle cx="12" cy="12" r="2.5" stroke="#1C1A17" stroke-width="1.7"></circle></svg>
</a>
</header>

<article style="display: flex; flex-direction: column; padding: 16px 22px 0; position: relative;">
<svg class="ripple echo is-playing" width="330" height="330" viewBox="0 0 330 330" fill="none" stroke="#B8342A" stroke-width="1" stroke-opacity=".3" aria-hidden="true" style="position: absolute; right: -96px; top: 20px; pointer-events: none;"><circle class="echo-ring" cx="165" cy="165" r="152" transform="scale(.34)" transform-origin="165 165"></circle><circle class="echo-ring" cx="165" cy="165" r="152" transform="scale(.55)" transform-origin="165 165"></circle><circle class="echo-ring" cx="165" cy="165" r="152" transform="scale(.78)" transform-origin="165 165"></circle><circle class="echo-ring" cx="165" cy="165" r="152"></circle></svg>

<div style="display: flex; gap: 8px;">
<label for="show-furigana" style="display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border: 1px solid #C9705F; border-radius: 3px; background: #FAEDE9; color: #8F2820; font-size: 13px; letter-spacing: .02em; cursor: pointer;"><input id="show-furigana" type="checkbox" checked style="width: 14px; height: 14px; margin: 0; accent-color: #B8342A;"> Furigana</label>
<label for="show-english" style="display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border: 1px solid #C9705F; border-radius: 3px; background: #FAEDE9; color: #8F2820; font-size: 13px; letter-spacing: .02em; cursor: pointer;"><input id="show-english" type="checkbox" checked style="width: 14px; height: 14px; margin: 0; accent-color: #B8342A;"> English</label>
<label for="show-polite" style="display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border: 1px solid #D9D2C1; border-radius: 3px; background: #FBF9F3; color: #55504A; font-size: 13px; letter-spacing: .02em; cursor: pointer;"><input id="show-polite" type="checkbox" style="width: 14px; height: 14px; margin: 0; accent-color: #B8342A;"> Polite</label>
</div>

<p lang="ja" style="position: relative; margin: 24px 0 0; font-family: 'Shippori Mincho','Hiragino Mincho ProN',serif; font-weight: 500; font-size: 29px; line-height: 2.05; letter-spacing: .01em;"><ruby>駅<rt>えき</rt></ruby>がどこにあるか<ruby>教<rt>おし</rt></ruby>えてもらえますか。</p>
<p style="position: relative; margin: 12px 0 0; padding-left: 13px; border-left: 2px solid #D9D2C1; font-size: 14px; line-height: 1.6; color: #55504A;">Could you tell me where the station is?</p>

<div style="display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 26px;">
<svg width="96" height="48" viewBox="0 0 86 44" fill="none" aria-hidden="true" style="position: relative;"><g stroke="#B8342A" stroke-opacity=".7" stroke-width="1.6"><path d="M79 22a36 36 0 0 0-12-27"></path><path d="M65 22a22 22 0 0 0-7.4-16.5"></path><path d="M51 22a8 8 0 0 0-2.6-6"></path><path d="M7 22a36 36 0 0 1 12-27"></path><path d="M21 22a22 22 0 0 1 7.4-16.5"></path><path d="M35 22a8 8 0 0 1 2.6-6"></path></g></svg>
</div>

<div style="display: flex; align-items: baseline; justify-content: center; gap: 10px; margin-top: 2px;">
<strong style="font-family: 'Shippori Mincho','Hiragino Mincho ProN',serif; font-weight: 600; font-size: 34px; line-height: 1; color: #1C1A17;">12</strong>
<span style="font-size: 11px; text-transform: uppercase; letter-spacing: .2em; color: #6B645B;">echoes so far</span>
</div>

<div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px;">
<span style="width: 7px; height: 7px; border-radius: 50%; background: #B8342A;"></span>
<span style="font-size: 12px; text-transform: uppercase; letter-spacing: .18em; color: #55504A;">Playing — say it with the voice</span>
</div>

<button type="button" aria-pressed="true" style="margin-top: 18px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 11px; background: #B8342A; color: #FCF7EE; border: none; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: 500; letter-spacing: .06em; cursor: pointer;">
<svg width="13" height="16" viewBox="0 0 13 16" fill="none" aria-hidden="true"><rect x="1" y="1" width="4" height="14" fill="#FCF7EE"></rect><rect x="8" y="1" width="4" height="14" fill="#FCF7EE"></rect></svg>
Pause</button>
</article>

<div style="flex-grow: 1;"></div>

<div style="display: flex; flex-direction: column; gap: 9px; padding: 14px 22px 16px; border-top: 1px solid #D9D2C1; background: rgba(251,249,243,.7);">
<label for="english-input" style="font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: #6B645B;">What do you want to say?</label>
<div style="display: flex; gap: 10px; align-items: stretch;">
<textarea id="english-input" rows="1" placeholder="Enter an English sentence" style="flex-grow: 1; min-width: 0; box-sizing: border-box; resize: none; height: 50px; padding: 14px; font-family: inherit; font-size: 15px; line-height: 1.4; color: #1C1A17; background: #FBF9F3; border: 1px solid #D9D2C1; border-radius: 4px; outline: none;"></textarea>
<button type="button" aria-label="Speak English" style="width: 50px; height: 50px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #FBF9F3; border: 1px solid #1C1A17; border-radius: 4px; cursor: pointer;">
<svg width="16" height="20" viewBox="0 0 16 20" fill="none" aria-hidden="true"><rect x="5" y="1" width="6" height="11" rx="3" stroke="#1C1A17" stroke-width="1.4"></rect><path d="M2 9.2a6 6 0 0 0 12 0M8 15.4V19M5.2 19h5.6" stroke="#1C1A17" stroke-width="1.4" stroke-linecap="round"></path></svg>
</button>
<button type="button" style="height: 50px; padding: 0 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: #B8342A; color: #FCF7EE; border: none; border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 500; letter-spacing: .05em; cursor: pointer;">Translate
<svg width="14" height="11" viewBox="0 0 16 12" fill="none" aria-hidden="true"><path d="M1 6h13M9.5 1.5 14 6l-4.5 4.5" stroke="#FCF7EE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>

<nav style="display: flex; border-top: 1px solid #D9D2C1; background: #FBF9F3;">
<a href="Main.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; height: 72px; text-decoration: none; color: #B8342A; border-top: 2px solid #B8342A; margin-top: -1px;">

<span style="font-size: 11px; letter-spacing: .08em;">Practice</span>

<a href="ReviewHome.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; height: 72px; text-decoration: none; color: #55504A; border-top: 2px solid transparent; margin-top: -1px;">

<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.6 10a7.4 7.4 0 1 1 2.2 5.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path><path d="M1.9 12.4 2.6 15.9l3.5-.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="position: absolute; top: -6px; left: 13px; min-width: 17px; height: 17px; padding: 0 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 2px; background: #B8342A; color: #FCF7EE; font-size: 10px;">7</span>

<span style="font-size: 11px; letter-spacing: .08em;">Review</span>

<svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M6.6 4.5h11M6.6 10h11M6.6 15.5h11M2.5 4.5h.01M2.5 10h.01M2.5 15.5h.01"></path></g></svg>
<span style="font-size: 11px; letter-spacing: .08em;">Library</span>
