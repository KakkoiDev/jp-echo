<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111410"><meta name="description" content="Translate English into Japanese and learn by shadowing."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css"><title>JP Echo</title></head><body>
<header><button id="history-button" class="icon-button" aria-label="History" aria-pressed="false">☰</button><h1>JP Echo</h1><button id="settings-button" class="icon-button" aria-label="Settings">⚙</button></header>
<main><section id="main-view"><div class="composer"><label for="english-input">What do you want to say?</label><div class="input-row"><textarea id="english-input" rows="3" placeholder="Enter an English sentence"></textarea><button id="microphone" class="mic" aria-label="Speak English">●</button></div><p id="voice-input-status" class="hint" aria-live="polite"></p><button id="translate" class="primary">Translate</button><p id="status" aria-live="polite"></p></div>
<article id="practice" hidden><div class="toggles"><label><input id="show-furigana" type="checkbox"> Furigana</label><label><input id="show-english" type="checkbox"> English</label></div><p id="japanese" lang="ja"></p><p id="english-display"></p><div class="counter"><strong id="echo-count">0</strong><span>echoes</span></div><p id="loop-state" aria-live="polite">Ready</p><div class="controls"><button id="play" class="primary">Play</button><button id="pause">Pause</button><button id="stop">Stop</button></div><div class="speech-settings"><label>Voice <select id="voice"></select></label><label>Speed <input id="rate" type="range" min=".6" max="1.4" step=".1"><span id="rate-value"></span></label><p id="voice-warning" class="error" hidden>No Japanese voice is installed on this device.</p></div></article></section>
<section id="history-view" hidden><div class="section-title"><button id="back">←</button><h2>History</h2></div><p id="empty-history">No sentences yet.</p><ul id="history-list"></ul><div class="backup"><button id="export">Export JSON</button><button id="import">Import JSON</button></div><input id="import-file" type="file" accept="application/json" hidden></section></main>
<dialog id="settings-dialog"><h2>Settings</h2><label>DeepSeek API key<input id="api-key" type="password" autocomplete="off"></label><p class="hint">Saved only in this browser. It is never included in exports.</p><label>Optional proxy URL<input id="proxy-url" type="url" placeholder="https://…/translate"></label><p class="hint">Used only when a direct browser request is blocked.</p><button id="close-settings" class="primary">Save</button></dialog><script type="module" src="./app.js"></script></body></html>
